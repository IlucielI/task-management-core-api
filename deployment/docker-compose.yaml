services:
  api:
    image: task-management-core-api:latest
    container_name: task-management-core-api
    env_file:
      - ../.env
    environment:
      APP_NAME: task-management-core-api
      APP_ENV: development
      HTTP_PORT: 8080
    ports:
      - "8080:8080"
    restart: unless-stopped

# Route configuration for Task Management Core API
# Maps HTTP endpoints directly to Server methods
routes:
  # Health check endpoint
  - method: GET
    path: /v1/health
    handler: HealthCheck

  # Teams endpoint
  - method: GET
    path: /v1/teams
    handler: GetTeams

  # Auth endpoints
  - method: POST
    path: /v1/auth/register
    handler: Register

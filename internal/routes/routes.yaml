# Route configuration for Task Management Core API
# Maps HTTP endpoints directly to Server methods
routes:
  # Health check endpoint
  - method: GET
    path: /v1/health
    handler: HealthCheck

  # Teams endpoint
  - method: GET
    path: /v1/teams
    handler: GetTeams

  # Auth endpoints
  - method: POST
    path: /v1/auth/register
    handler: Register

  - method: POST
    path: /v1/auth/login
    handler: Login

  # Task endpoints
  - method: POST
    path: /v1/tasks
    handler: CreateTask
    auth: true

  - method: GET
    path: /v1/tasks/:id
    handler: GetTaskByID
    auth: true


# Route configuration for Task Management Core API
# Maps HTTP endpoints directly to Server methods
routes:
  # Health check endpoint
  - method: GET
    path: /v1/health
    handler: HealthCheck

  # Documentation endpoints
  - method: GET
    path: /openapi.yaml
    handler: OpenAPISpec

  - method: GET
    path: /docs
    handler: APIDocs

  # Teams endpoint
  - method: GET
    path: /v1/teams
    handler: GetTeams
    basic_auth: true

  # Auth endpoints
  - method: POST
    path: /v1/auth/register
    handler: Register
    basic_auth: true

  - method: POST
    path: /v1/auth/login
    handler: Login
    basic_auth: true

  # Task endpoints
  - method: GET
    path: /v1/tasks
    handler: ListTasks
    auth: true

  - method: POST
    path: /v1/tasks
    handler: CreateTask
    auth: true

  - method: GET
    path: /v1/tasks/:id
    handler: GetTaskByID
    auth: true

  - method: PUT
    path: /v1/tasks/:id
    handler: UpdateTask
    auth: true

  - method: DELETE
    path: /v1/tasks/:id
    handler: DeleteTask
    auth: true

  - method: POST
    path: /v1/tasks/:id/assign
    handler: AssignTask
    auth: true

  # User endpoints
  - method: GET
    path: /v1/users
    handler: ListUsers
    auth: true

